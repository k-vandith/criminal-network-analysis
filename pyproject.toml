[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linklens"
version = "1.0.0"
description = "Local-first, explainable network analysis workspace"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.54.0", "networkx>=3.2", "pandas>=2.2.0", "numpy>=1.26.0", "plotly>=5.18.0", "reportlab>=4.0.0", "pillow>=12.3.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.0"]

[project.scripts]
linklens = "linklens.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["E501"]
