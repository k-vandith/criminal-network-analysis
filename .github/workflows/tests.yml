name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - run: ruff check src tests run.py
      - run: bandit -q -r src run.py -ll
      - run: pytest -v
        env:
          PYTHONPATH: .
